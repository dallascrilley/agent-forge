[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-assistant"
version = "0.1.0"
description = "Interactive assistant that answers questions about a local docs folder, with filesystem MCP access. (generated by agent-forge)"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2",
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langchain-anthropic>=0.3",
  "langchain-mcp-adapters>=0.1"
]

[tool.setuptools]
packages = ["my_agent"]
